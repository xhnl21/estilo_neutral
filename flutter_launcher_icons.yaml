# Ícono de la app. Las imágenes se generan desde assets/icons.png (sin
# modificarlo) con:  python3 tools/iconos/generar_icono_app.py
# y después:         dart run flutter_launcher_icons
#
# El logo va recortado con la forma de su marco y reducido para entrar en la
# zona segura del ícono adaptativo: así el marco se ve completo con cualquier
# máscara (círculo, cuadrado redondeado, la de MIUI, gota) y en iOS.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/iconos_app/completo.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/iconos_app/fondo.png"
  adaptive_icon_foreground: "assets/iconos_app/frente.png"
  adaptive_icon_monochrome: "assets/iconos_app/monocromo.png"
  remove_alpha_ios: true
  background_color_ios: "#D4C7B4"

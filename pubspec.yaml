name: estilo_neutral
description: Conector Flutter para Google Sheets (Estilo Neutral) con arquitectura ORM bajo demanda y cero polling.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  url_launcher: ^6.3.2
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^14.8.1
  video_player: ^2.9.2
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icons.png
    - assets/splash_screen.jpeg
    - assets/estilo_neutral.mp4
